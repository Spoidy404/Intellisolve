name: Render UML diagrams as PNG

on:
  push:
    paths:
      - "docs/diagrams/**/*.svg"
      - ".github/workflows/render-uml-png.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG renderer
        run: pip install cairosvg
      - name: Render SVG previews to PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          for svg in sorted(Path("docs/diagrams").glob("*/*.svg")):
              png = svg.with_suffix(".png")
              cairosvg.svg2png(url=str(svg), write_to=str(png), output_width=1800)
              print(f"Rendered {png}")
          PY
      - name: Commit PNG diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/*/*.png
          if git diff --cached --quiet; then
            echo "No PNG changes to commit"
          else
            git commit -m "Add PNG exports of UML diagrams"
            git push origin HEAD:main
          fi
